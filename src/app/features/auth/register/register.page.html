<div class="auth-wrapper">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Crear cuenta</h1>
    <p class="muted">Regístrate para empezar a gestionar incidencias</p>

    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      @let username = form.controls.username;
      @if (username.touched && username.invalid) {
        <small class="field__error">
          @if (username.hasError('required')) { El usuario es obligatorio }
          @else if (username.hasError('minlength')) { Mínimo 3 caracteres }
          @else if (username.hasError('pattern')) { Solo letras, números, punto, guion y guion bajo }
          @else { Máximo 100 caracteres }
        </small>
      }
    </label>

    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @let email = form.controls.email;
      @if (email.touched && email.invalid) {
        <small class="field__error">
          @if (email.hasError('required')) { El correo es obligatorio } @else { Correo no válido }
        </small>
      }
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @let password = form.controls.password;
      @if (password.touched && password.invalid) {
        <small class="field__error">
          @if (password.hasError('required')) { La contraseña es obligatoria }
          @else if (password.hasError('minlength')) { Mínimo 8 caracteres }
          @else { Máximo 128 caracteres }
        </small>
      }
    </label>

    <label class="field">
      <span>Confirmar contraseña</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.controls.confirmPassword.touched && form.hasError('passwordMismatch')) {
        <small class="field__error">Las contraseñas no coinciden</small>
      }
    </label>

    @if (errorMessage(); as msg) {
      <div class="alert alert--error" role="alert">{{ msg }}</div>
    }

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta…' : 'Registrarme' }}
    </button>

    <p class="auth-card__footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</div>
