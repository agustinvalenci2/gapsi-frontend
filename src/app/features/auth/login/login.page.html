<div class="auth-wrapper">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Issue Tracker</h1>
    <p class="muted">Inicia sesión para gestionar tus incidencias</p>

    <label class="field">
      <span>Usuario</span>
      <input type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.hasError('required')) {
        <small class="field__error">El usuario es obligatorio</small>
      }
    </label>

    <label class="field">
      <span>Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <small class="field__error">La contraseña es obligatoria</small>
      }
    </label>

    @if (errorMessage(); as msg) {
      <div class="alert alert--error" role="alert">{{ msg }}</div>
    }

    <button type="submit" class="btn btn--primary btn--block" [disabled]="loading()">
      {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>

    <p class="auth-card__footer">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </form>
</div>
